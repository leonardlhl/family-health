name: Publish family viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: family-viewer-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build empty interface only
        env:
          HEALTH_SUPABASE_URL: ${{ vars.HEALTH_SUPABASE_URL }}
          HEALTH_SUPABASE_ANON_KEY: ${{ vars.HEALTH_SUPABASE_ANON_KEY }}
          HEALTH_ARCHIVE_ID: family
        # Both variables empty publishes the locked setup screen. Partial/invalid configuration fails.
        run: python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
